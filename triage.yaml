# ===========================================================================
# triage.yaml — personal software-project workflow (V1)
#
# This version begins with manually created intake reports and Kanban tasks.
# `sources: []` is intentional: scouts, cron jobs, profiles, and production
# automation are deliberately out of scope for V1.
# ===========================================================================

name: personal-software-projects
board: personal-projects
workspace_root: ./work
cost_gate_usd: 5

# V1 uses manual intake. Future intake may come directly from Hermes, Obsidian,
# or a CLI/helper without requiring manually constructed Kanban tasks.
sources: []

item_schema:
  fields:
    - title
    - claim
    - sources
    - why_it_may_matter
    - objective
    - target_users
    - constraints
    - existing_repository
    - project_type_hint

dedup:
  method: token-cosine
  duplicate_threshold: 0.62
  possible_threshold: 0.40

# Manual submissions should be easy to advance while still making priority
# trade-offs visible. The orchestrator scores each dimension in LLM mode.
rubric:
  threshold: 45
  dimensions:
    - {key: personal_value,       max: 25, hint: "value to the user's personal work, goals, or quality of life"}
    - {key: feasibility,          max: 20, hint: "can the approved scope be completed safely in the managed workspace"}
    - {key: outcome_clarity,      max: 15, hint: "how clearly the desired outcome, users, and success criteria are stated"}
    - {key: learning_reuse_value, max: 15, hint: "learning, reusable components, or future-project leverage"}
    - {key: effort_efficiency,    max: 15, hint: "expected value relative to implementation effort and external cost"}
    - {key: readiness,            max: 10, hint: "availability of requirements, references, constraints, and a workable starting point"}

research_lanes:
  role: researcher
  lanes:
    - requirements_and_context
    - existing_code_and_dependencies
    - technical_options_and_risks
    - project_classification
  classifier_lane: project_classification

# `project_type_hint` is only a user-provided expectation. The classification
# emitted by `project_classification` is authoritative for routing.
route:
  classifier: project_classification.project_type
  map:
    website: software_project
    web_app: software_project
    mobile_app: software_project
    automation: software_project
    research_only: research_only
    shelve: shelve

paths:
  software_project:
    prep:
      - {stage: requirements_synthesis, role: researcher}
      - {stage: solution_architecture,  role: architect}
    propose: {role: orchestrator, template: paths/proposals/software-project.md}
    fulfill:
      - {stage: development,              role: developer}
      - {stage: testing,                  role: tester}
      - {stage: review,                   role: reviewer}
      - {stage: documentation_delivery,   role: orchestrator}
    workspace_subdir: software-projects
    scope_rails: paths/rails/software-project.md
    deliverable_spec: paths/specs/software-project.md

  research_only:
    prep:
      - {stage: requirements_synthesis, role: researcher}
      - {stage: research_architecture,  role: architect}
    propose: {role: orchestrator, template: paths/proposals/research-only.md}
    fulfill:
      - {stage: research,                role: researcher}
      - {stage: review,                  role: reviewer}
      - {stage: documentation_delivery,  role: orchestrator}
    workspace_subdir: research
    scope_rails: paths/rails/research-only.md
    deliverable_spec: paths/specs/research-only.md

  shelve:
    auto: true

roles:
  orchestrator: project-orchestrator
  researcher: project-researcher
  architect: software-architect
  developer: developer
  tester: qa-tester
  reviewer: reviewer

# V1 records an approval request for manual handling. No messaging or production
# delivery integration is configured by this repository change.
gate:
  channel: manual
  approve: [approve]
  shelve: [shelve, "reject the rest"]
  modify: [modify]